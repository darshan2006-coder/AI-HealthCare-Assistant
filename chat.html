<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="chatPageTitle">New Chat - HealthBot</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dark-theme.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h2>HealthBot</h2>
        </div>
        <div class="nav-menu">
            <a href="home.html" class="nav-link" data-i18n="navHome">Home</a>
            <a href="chat.html" class="nav-link active" data-i18n="navNewChat">New Chat</a>
            <a href="history.html" class="nav-link" data-i18n="navHistory">Chat History</a>
            <a href="about.html" class="nav-link" data-i18n="navAbout">About</a>
            <button id="themeToggle" class="theme-btn">🌙</button>

            <div class="language-picker">
                <select id="languageSelect" style="padding: 6px 12px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; cursor: pointer;">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                    <option value="ml">മലയാളം (Malayalam)</option>
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="kn">ಕನ್ನಡ (Kannada)</option>
                </select>
            </div>

            <button id="logoutBtn" class="logout-btn" data-i18n="navLogout">Logout</button>
        </div>
    </nav>

    <div class="container dashboard" style="margin-top: 30px;">
        <div class="dashboard-cards" style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; align-items: start;">
            
            <div class="card basic-form-card" style="text-align: left;">
                <h3 data-i18n="chatConsultationTitle">Consultation Details</h3>
                
                <div class="api-key-section" style="margin-top: 10px; padding-bottom: 15px; border-bottom: 1px solid #eee; margin-bottom: 15px;">
                    <label for="userApiKey" style="display: flex; align-items: center; font-size: 14px; font-weight: bold; margin-bottom: 5px;">
                        <span data-i18n="chatApiKeyLabel">Your Gemini API Key (Optional)</span>
                        <span title="To prevent global rate limits on this free portfolio demo, you can optionally paste your own free Google Gemini API key. It is processed dynamically per request and never stored on our servers." style="margin-left: 5px; cursor: help; background: #007bff; color: white; border-radius: 50%; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px;">?</span>
                    </label>
                    <!-- Fixed: Changed data-i18n to data-i18n-placeholder -->
                    <input type="password" id="userApiKey" data-i18n-placeholder="chatApiKeyPlaceholder" placeholder="Paste custom key..." style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 12px;">
                </div>

                <form id="symptomForm" class="auth-form" style="margin-top: 15px;">
                    <div class="form-group">
                        <label for="symptomsText" data-i18n="chatSymptomsLabel">Symptoms:</label>
                        <!-- Fixed: Changed data-i18n to data-i18n-placeholder -->
                        <input type="text" id="symptomsText" data-i18n-placeholder="chatSymptomsPlaceholder" placeholder="e.g., Fever, Headache" required>
                        <small style="color: #666; font-size: 12px;" data-i18n="chatSymptomsHint">Separate multiple with commas</small>
                    </div>
                    <div class="form-group">
                        <label for="duration" data-i18n="chatDurationLabel">Duration:</label>
                        <!-- Fixed: Changed data-i18n to data-i18n-placeholder -->
                        <input type="text" id="duration" data-i18n-placeholder="chatDurationPlaceholder" placeholder="e.g., 3 days" required>
                    </div>
                    <div class="form-group">
                        <label for="severity" data-i18n="chatSeverityLabel">Severity:</label>
                        <select id="severity" required style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="Mild" data-i18n="chatSeverityMild">Mild</option>
                            <option value="Moderate" data-i18n="chatSeverityMod">Moderate</option>
                            <option value="Severe" data-i18n="chatSeveritySev">Severe</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="temperature" data-i18n="chatTempLabel">Temperature (°C/°F):</label>
                        <!-- Fixed: Changed data-i18n to data-i18n-placeholder -->
                        <input type="text" id="temperature" data-i18n-placeholder="chatTempPlaceholder" placeholder="e.g., 38°C or Normal" required>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;" id="sendBtn" data-i18n="chatAnalyzeBtn">Analyze Symptoms</button>
                </form>
            </div>

            <div class="card chat-container" style="height: 600px; display: flex; flex-direction: column; padding: 0;">
                <div class="chat-header" style="padding: 15px; border-bottom: 1px solid #eee; background-color: #f8f9fa;">
                      <h2 style="margin: 0; font-size: 18px;" data-i18n="chatBotTitle">AI Healthcare Assistant</h2>
                     <div class="chat-actions">
                            <small style="color: #666; margin-right: 15px;" id="chatStatus" data-i18n="chatStatusReady">Ready</small>
                            <button id="newChatHeaderBtn" class="btn-secondary" style="padding: 5px 10px; font-size: 12px; margin-right: 8px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;" data-i18n="chatNewBtn">New Chat</button>
                          <button id="saveChatBtn" class="btn-primary" style="padding: 5px 10px; font-size: 12px;" data-i18n="chatSaveBtn">Save Chat</button>
                          <button id="downloadPdfBtn" class="btn-primary" style="padding: 5px 10px; font-size: 12px; background-color: #28a745; border: none;" data-i18n="chatExportBtn">📄 Export PDF</button>
                     </div>
                 </div>

                <div class="chat-messages" id="chatMessages" style="flex-grow: 1; padding: 15px; overflow-y: auto;">
                    <div class="message bot-message" style="background-color: #e9ecef; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                        <strong>🤖 HealthBot:</strong>
                        <p style="margin: 5px 0 0 0;" data-i18n="chatBotGreeting">Hello! I'm your AI healthcare assistant. Please fill out your symptoms on the left to begin.</p>
                        <small class="message-time"></small>
                    </div>
                </div>
                <div class="chat-input-container" style="padding: 15px; border-top: 1px solid #eee; background-color: #fff; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                       <div class="input-group" style="display: flex; gap: 10px;">
                            <!-- Fixed: Changed data-i18n to data-i18n-placeholder -->
                            <input type="text" id="messageInput" data-i18n-placeholder="chatInputPlaceholder" placeholder="Type your health question here..." maxlength="500" style="flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
                            <button id="micBtn" type="button" style="border: none; background: transparent; font-size: 1.2rem; cursor: pointer;" title="Use Voice">🎤</button>
                            <button id="chatSendBtn" class="send-btn" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;" data-i18n="chatSendBtnTxt">Send</button>
                        </div>
                </div>
            </div>

        </div>
    </div>

    <div id="warningModal" class="warning-modal">
        <div class="warning-content">
            <h3 id="warningTitle" data-i18n="chatWarningTitle">⚠ Warning</h3>
            <p id="warningText"></p>
            <button id="warningOkBtn" data-i18n="chatWarningOkBtn">OK</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script src="storage.js"></script>
    <script type="module" src="js/chat.js"></script>
    <script src="translations.js"></script>
</body>
</html>
